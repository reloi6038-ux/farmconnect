<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FarmConnect">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FarmConnect</title>
<meta name="description" content="Sign in to FarmConnect to manage produce listings or send enquiries to verified Nigerian farmers.">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
</head><body>
<nav class="navbar" id="navbar"></nav>

<div class="container" style="padding-top:1rem">
  <div id="breadcrumbs" style="display:none;margin-bottom:1rem"></div>
</div>
<section class="section"><div class="container" style="max-width:440px">
  <h2 class="section-title">Welcome Back</h2>
  <p class="section-sub">Sign in to your FarmConnect account</p>
  <div class="card"><div class="card-body">
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" class="form-control" id="email" required autocomplete="email" placeholder="you@example.com"></div>
      <div class="form-group"><label>Password</label><input type="password" class="form-control" id="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign In</button>
    </form>
    <p class="text-center mt-3" style="font-size:.9rem">No account? <a href="/register.html">Create one free</a></p>
  </div></div>
</div></section>
<footer id="footer"></footer>
<script src="/js/api.js"></script><script src="/js/components.js"></script><script src="/js/auth.js"></script>
</body></html>
