<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — FarmConnect</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/admin.css">
<style>
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi-card { background: #fff; border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .kpi-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .kpi-value { font-size: 1.9rem; font-weight: 800; color: var(--forest); line-height: 1.1; margin-top: .25rem; }
  .kpi-sub { font-size: .78rem; color: var(--muted); margin-top: .25rem; }
  .chart-panel { background: #fff; border-radius: 14px; padding: 1.25rem; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 1.5rem; }
  .chart-panel h3 { font-size: 1rem; color: var(--forest); margin-bottom: 1rem; }
  .spark-wrap { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin-top: .5rem; }
  .spark-bar { flex: 1; background: linear-gradient(180deg, var(--leaf), var(--forest)); border-radius: 3px 3px 0 0; min-height: 3px; transition: opacity .2s; }
  .spark-bar:hover { opacity: .75; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .bar-row { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
  .bar-row:last-child { border-bottom: none; }
</style>
</head><body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="brand"><img src="/favicon.svg" alt="" width="32" height="32" style="border-radius:8px"><span style="margin-left:.5rem">Admin</span></div>
    <nav>
      <a href="/admin/dashboard.html" class="active">📊 Dashboard</a>
      <a href="/admin/users.html">👥 Users</a>
      <a href="/admin/produce.html">🌾 Produce</a>
      <a href="/admin/categories.html">📁 Categories</a>
      <a href="/admin/market-prices.html">📈 Market Prices</a>
      <a href="/admin/enquiries.html">✉️ Enquiries</a>
      <a href="/admin/messages.html">💬 Messages</a>
      <a href="/admin/reviews.html">⭐ Reviews</a>
      <a href="/" style="margin-top:auto">← Back to Site</a>
      <a href="#" id="adminLogout">Logout</a>
    </nav>
  </aside>
  <main class="admin-content">
    <div id="breadcrumbs" style="display:none;margin-bottom:1rem"></div>
    <div class="flex justify-between items-center" style="margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem">
      <h1 style="color:var(--forest);font-size:1.6rem">Dashboard</h1>
      <span class="badge badge-green" id="avgRatingBadge">Loading…</span>
    </div>
    <div class="kpi-grid" id="kpiGrid">Loading…</div>
    <div class="chart-panel">
      <h3>Users · last 30 days</h3>
      <div class="spark-wrap" id="usersSpark"></div>
    </div>
    <div class="chart-panel">
      <h3>Produce created · last 30 days</h3>
      <div class="spark-wrap" id="produceSpark"></div>
    </div>
    <div class="two-col">
      <div class="chart-panel">
        <h3>Top Viewed Produce</h3>
        <div id="topViewed"></div>
      </div>
      <div class="chart-panel">
        <h3>Top Favorited</h3>
        <div id="topFavorited"></div>
      </div>
    </div>
    <div class="two-col">
      <div class="chart-panel">
        <h3>Produce by State</h3>
        <div id="produceByState"></div>
      </div>
      <div class="chart-panel">
        <h3>Enquiry Status Breakdown</h3>
        <div id="enqByStatus"></div>
      </div>
    </div>
    <div class="chart-panel">
      <h3>Top Farmers</h3>
      <div id="topFarmers"></div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script>
if (!requireAuth('admin')) throw new Error('auth');
document.getElementById('adminLogout').onclick = (e) => { e.preventDefault(); clearSession(); location.href = '/admin/login.html'; };

function kpi(label, value, sub) {
  return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}

function sparkline(el, series) {
  if (!series || !series.length) { el.innerHTML = '<p class="text-muted" style="font-size:.85rem">No data</p>'; return; }
  const max = Math.max(...series.map(d => d.count)) || 1;
  el.innerHTML = series.map(d => {
    const h = Math.max(6, Math.round((d.count / max) * 80));
    return `<div class="spark-bar" style="height:${h}px" title="${d._id}: ${d.count}"></div>`;
  }).join('');
}

function barList(el, rows, labelKey, valueKey) {
  if (!rows || !rows.length) { el.innerHTML = '<p class="text-muted" style="font-size:.85rem">No data</p>'; return; }
  const max = Math.max(...rows.map(r => r[valueKey])) || 1;
  el.innerHTML = rows.map(r => {
    const pct = Math.round((r[valueKey] / max) * 100);
    return `<div class="bar-row"><div style="flex:1;position:relative;padding:2px 0"><div style="background:var(--beige);border-radius:3px;height:22px;position:absolute;inset:0;width:${pct}%;opacity:.7"></div><span style="position:relative;padding-left:.5rem;font-weight:600">${escapeHtml(r[labelKey] || 'Unknown')}</span></div><strong>${r[valueKey]}</strong></div>`;
  }).join('');
}

async function load() {
  try {
    const [s, a] = await Promise.all([API.get('/admin/stats'), API.get('/admin/analytics')]);
    const d = s.data;
    document.getElementById('avgRatingBadge').innerHTML = `⭐ ${d.avgRating} avg rating <span style="font-weight:500;opacity:.8;margin-left:.4rem">(${d.reviews} reviews · ${d.pendingReviews} pending)</span>`;
    document.getElementById('kpiGrid').innerHTML =
      kpi('Users', d.users, `${d.farmers} farmers · ${d.buyers} buyers`) +
      kpi('Produce', d.produce, `${d.activeProduce} active · ${d.organicCount} organic`) +
      kpi('Enquiries', d.enquiries, `${d.pendingEnquiries} pending`) +
      kpi('Reviews', d.reviews, `${d.pendingReviews} awaiting moderation`) +
      kpi('Market Prices', d.prices) +
      kpi('Messages', d.messages, 'unread') +
      kpi('Featured Listings', d.featuredCount) +
      kpi('Average Rating', d.avgRating + ' / 5');

    sparkline(document.getElementById('usersSpark'), a.data.usersOverTime);
    sparkline(document.getElementById('produceSpark'), a.data.produceOverTime);

    document.getElementById('topViewed').innerHTML = d.topViewed.map(p =>
      `<div class="bar-row"><span>${escapeHtml(p.productName)}</span><strong>${p.views} views</strong></div>`
    ).join('') || '<p class="text-muted">No data</p>';

    document.getElementById('topFavorited').innerHTML = d.topFavorited.map(p =>
      `<div class="bar-row"><span>${escapeHtml(p.productName)}</span><strong>${p.favoriteCount} saves</strong></div>`
    ).join('') || '<p class="text-muted">No data</p>';

    barList(document.getElementById('produceByState'), d.produceByState, '_id', 'count');
    barList(document.getElementById('enqByStatus'), d.enquiryByStatus, '_id', 'count');
    document.getElementById('topFarmers').innerHTML = d.topFarmers.map(f =>
      `<div class="bar-row"><span>${escapeHtml(f.name)} ${f.verified ? '✅' : ''} · <small class="text-muted">${escapeHtml(f.location || '')}, ${escapeHtml(f.state || '')}</small></span></div>`
    ).join('');
  } catch (e) {
    document.getElementById('kpiGrid').innerHTML = `<p style="color:var(--danger)">${escapeHtml(e.message)}</p>`;
  }
}
load();
</script>
</body></html>
