<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FarmConnect">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Prices — FarmConnect</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
</head><body>
<nav class="navbar" id="navbar"></nav>
<section class="section"><div class="container">
  <h2 class="section-title">Live Market Prices</h2>
  <p class="section-sub">Informational prices from markets across Nigeria. Always verify with farmers before large purchases.</p>

  <div class="card mb-3"><div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.75rem;align-items:end">
      <div class="form-group" style="margin:0"><label>Search</label><input class="form-control" id="search" placeholder="Tomatoes, maize..."></div>
      <div class="form-group" style="margin:0"><label>State</label><input class="form-control" id="state" placeholder="e.g. Lagos"></div>
      <div class="form-group" style="margin:0"><label>Sort</label><select class="form-control" id="sort">
        <option value="newest">Newest</option><option value="price-asc">Price ↑</option><option value="price-desc">Price ↓</option>
      </select></div>
      <button class="btn btn-primary" id="applyBtn" style="height:44px">Filter</button>
    </div>
  </div></div>

  <div class="table-wrap"><table>
    <thead><tr><th>Product</th><th>Category</th><th>Market</th><th>State</th><th>Min</th><th>Max</th><th>Average</th><th>Trend</th><th>Date</th></tr></thead>
    <tbody id="priceTbody"><tr><td colspan="9" class="text-center text-muted">Loading...</td></tr></tbody>
  </table></div>
</div></section>
<footer id="footer"></footer>
<script src="/js/api.js"></script><script src="/js/components.js"></script>
<script src="/js/market-prices.js"></script>
</body></html>
