<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Produce — FarmConnect</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
</head><body>
<nav class="navbar" id="navbar"></nav>
<section class="section"><div class="container" style="max-width:720px">
  <h2 class="section-title">Add Produce Listing</h2>
  <p class="section-sub">List your produce to reach thousands of buyers</p>
  <div class="card"><div class="card-body">
    <form id="produceForm">
      <div class="form-group"><label>Product Name *</label><input class="form-control" id="productName" required placeholder="e.g. Fresh Tomatoes"></div>
      <div class="form-group"><label>Category *</label><select class="form-control" id="category" required></select></div>
      <div class="form-group"><label>Description</label><textarea class="form-control" id="description" placeholder="Tell buyers about your produce..."></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label>Quantity *</label><input type="number" class="form-control" id="quantity" min="0" required></div>
        <div class="form-group"><label>Unit *</label><select class="form-control" id="unit">
          <option value="kg">kg</option><option value="bag">bag</option><option value="crate">crate</option><option value="tonne">tonne</option><option value="piece">piece</option><option value="bunch">bunch</option>
        </select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label>Price (₦) *</label><input type="number" class="form-control" id="price" min="0" required></div>
        <div class="form-group"><label>Minimum Order</label><input type="number" class="form-control" id="minimumOrder" value="1" min="1"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label>Location *</label><input class="form-control" id="location" required placeholder="e.g. Zaria"></div>
        <div class="form-group"><label>State *</label><input class="form-control" id="state" required placeholder="e.g. Kaduna"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="form-group"><label>Quality Grade</label><select class="form-control" id="qualityGrade">
          <option value="A">A (Premium)</option><option value="B">B (Good)</option><option value="C">C (Standard)</option>
        </select></div>
        <div class="form-group"><label>Organic</label><select class="form-control" id="organic">
          <option value="false">No</option><option value="true">Yes</option>
        </select></div>
      </div>

      <div class="form-group">
        <label>Produce Photos (up to 5)</label>
        <input type="file" class="form-control" id="imageInput" accept="image/*" multiple>
        <p class="form-hint">JPG, PNG, or WEBP. Max 5MB per file. Listings with photos get 3× more enquiries.</p>
        <div id="imagePreview" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:.5rem;margin-top:.75rem"></div>
      </div>

      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Publish Listing</button>
      <p class="text-muted text-center mt-2" style="font-size:.82rem" id="statusLine"></p>
    </form>
  </div></div>
</div></section>
<footer id="footer"></footer>
<script src="/js/api.js"></script><script src="/js/components.js"></script>
<script>
if (requireAuth('farmer')) {
  API.get('/categories').then(r => {
    const sel = document.getElementById('category');
    sel.innerHTML = r.data.map(c => `<option value="${c._id}">${escapeHtml(c.name)}</option>`).join('');
  }).catch(e => toast(e.message, 'error'));

  let selectedFiles = [];
  const imageInput = document.getElementById('imageInput');
  const preview = document.getElementById('imagePreview');

  imageInput.addEventListener('change', () => {
    selectedFiles = Array.from(imageInput.files || []).slice(0, 5);
    preview.innerHTML = '';
    selectedFiles.forEach((file, i) => {
      const url = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)';
      wrap.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover"><button type="button" data-idx="${i}" style="position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:.8rem">×</button>`;
      preview.appendChild(wrap);
    });
    preview.querySelectorAll('[data-idx]').forEach(b => {
      b.onclick = (ev) => {
        ev.preventDefault();
        const idx = Number(b.dataset.idx);
        selectedFiles.splice(idx, 1);
        const dt = new DataTransfer();
        selectedFiles.forEach(f => dt.items.add(f));
        imageInput.files = dt.files;
        imageInput.dispatchEvent(new Event('change'));
      };
    });
  });

  document.getElementById('produceForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const statusLine = document.getElementById('statusLine');
    btn.disabled = true; btn.textContent = 'Publishing...';
    statusLine.textContent = 'Creating listing...';
    try {
      const r = await API.post('/produce', {
        productName: document.getElementById('productName').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        quantity: Number(document.getElementById('quantity').value),
        unit: document.getElementById('unit').value,
        price: Number(document.getElementById('price').value),
        minimumOrder: Number(document.getElementById('minimumOrder').value),
        location: document.getElementById('location').value,
        state: document.getElementById('state').value,
        qualityGrade: document.getElementById('qualityGrade').value,
        organic: document.getElementById('organic').value === 'true'
      });

      const produceId = r.data._id;

      if (selectedFiles.length > 0) {
        statusLine.textContent = `Uploading ${selectedFiles.length} image(s)...`;
        const fd = new FormData();
        selectedFiles.forEach(f => fd.append('images', f));
        const up = await fetch(`/api/produce/${produceId}/images`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + API.token() },
          body: fd
        });
        if (!up.ok) {
          const errBody = await up.json().catch(() => ({}));
          throw new Error(errBody.message || 'Image upload failed');
        }
      }

      toast('Produce listed successfully!');
      setTimeout(() => location.href = '/farmer-dashboard.html', 700);
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Publish Listing';
      statusLine.textContent = '';
    }
  };
}
</script>
</body></html>
