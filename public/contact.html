<!DOCTYPE html><html lang="en"><head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FarmConnect"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact — FarmConnect</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css"></head><body>
<nav class="navbar" id="navbar"></nav>
<section class="section"><div class="container" style="max-width:640px">
  <h2 class="section-title">Contact Us</h2>
  <p class="section-sub">We typically respond within 24 hours</p>
  <div class="card"><div class="card-body">
    <form id="contactForm">
      <div class="form-group"><label>Name</label><input class="form-control" id="name" required></div>
      <div class="form-group"><label>Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="form-group"><label>Phone</label><input class="form-control" id="phone"></div>
      <div class="form-group"><label>Subject</label><input class="form-control" id="subject" required></div>
      <div class="form-group"><label>Message</label><textarea class="form-control" id="message" required></textarea></div>
      <button class="btn btn-primary btn-block" type="submit">Send Message</button>
    </form>
  </div></div>
</div></section>
<footer id="footer"></footer>
<script src="/js/api.js"></script><script src="/js/components.js"></script>
<script>
document.getElementById('contactForm').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await API.post('/contact', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value
    });
    toast('Message sent! We\'ll respond soon.');
    document.getElementById('contactForm').reset();
  } catch (err) { toast(err.message, 'error'); }
};
</script>
</body></html>
