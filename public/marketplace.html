<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FarmConnect">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — FarmConnect</title>
<meta name="description" content="Browse fresh produce from verified Nigerian farmers. Filter by category, state, price, and organic status.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/animations.css">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<section class="section">
  <div class="container">
    <h1 class="section-title">Marketplace</h1>
    <p class="section-sub">Discover fresh produce from verified farmers nationwide</p>

    <div class="card mb-4"><div class="card-body">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:.75rem;align-items:end">
        <div class="form-group" style="margin-bottom:0"><label>Search</label><input class="form-control" id="search" placeholder="Tomatoes, maize..."></div>
        <div class="form-group" style="margin-bottom:0"><label>Category</label><select class="form-control" id="category"><option value="">All</option></select></div>
        <div class="form-group" style="margin-bottom:0"><label>State</label><input class="form-control" id="state" placeholder="e.g. Kaduna"></div>
        <div class="form-group" style="margin-bottom:0"><label>Sort</label><select class="form-control" id="sort">
          <option value="newest">Newest</option>
          <option value="price-asc">Price ↑</option>
          <option value="price-desc">Price ↓</option>
          <option value="popular">Popular</option>
        </select></div>
        <div class="form-group" style="margin-bottom:0"><label>Organic</label><select class="form-control" id="organic">
          <option value="">Any</option>
          <option value="true">Organic only</option>
        </select></div>
        <button class="btn btn-primary" id="applyBtn" style="height:44px">Apply</button>
      </div>
    </div></div>

    <div class="flex justify-between items-center mb-2">
      <p class="text-muted" id="resultCount">Loading...</p>
      <button class="btn btn-secondary btn-sm" id="clearBtn">Clear filters</button>
    </div>

    <div class="product-grid" id="grid"></div>
    <div id="pagination" class="flex justify-center gap-1 mt-4 flex-wrap"></div>
  </div>
</section>

<footer id="footer"></footer>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/marketplace.js"></script>
</body>
</html>
