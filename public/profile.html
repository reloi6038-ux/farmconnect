<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FarmConnect">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — FarmConnect</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/responsive.css">
</head><body>
<nav class="navbar" id="navbar"></nav>

<div class="container" style="padding-top:1rem">
  <div id="breadcrumbs" style="display:none;margin-bottom:1rem"></div>
</div>
<section class="section"><div class="container" style="max-width:680px">
  <h2 class="section-title">My Profile</h2>
  <div class="card"><div class="card-body">
    <form id="profileForm">
      <div class="form-group"><label>Name</label><input class="form-control" id="name"></div>
      <div class="form-group"><label>Phone</label><input class="form-control" id="phone"></div>
      <div class="form-group"><label>State</label><input class="form-control" id="state"></div>
      <div class="form-group"><label>Location</label><input class="form-control" id="location"></div>
      <div class="form-group"><label>Bio</label><textarea class="form-control" id="bio"></textarea></div>
      <button class="btn btn-primary btn-block" type="submit">Save Changes</button>
    </form>
  </div></div>

  <div class="card mt-3"><div class="card-body">
    <h3 class="mb-2">Change Password</h3>
    <form id="pwForm">
      <div class="form-group"><label>Current Password</label><input type="password" class="form-control" id="currentPassword" required></div>
      <div class="form-group"><label>New Password</label><input type="password" class="form-control" id="newPassword" minlength="6" required></div>
      <button class="btn btn-secondary btn-block" type="submit">Update Password</button>
    </form>
  </div></div>
</div></section>
<footer id="footer"></footer>
<script src="/js/api.js"></script><script src="/js/components.js"></script>
<script>
if (requireAuth()) {
  API.get('/auth/me').then(r => {
    ['name', 'phone', 'state', 'location', 'bio'].forEach(k => document.getElementById(k).value = r.data[k] || '');
  }).catch(e => toast(e.message, 'error'));
  document.getElementById('profileForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await API.put('/auth/profile', {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        state: document.getElementById('state').value,
        location: document.getElementById('location').value,
        bio: document.getElementById('bio').value
      });
      toast('Profile updated');
      localStorage.setItem('fmc_name', document.getElementById('name').value);
    } catch (err) { toast(err.message, 'error'); }
  };
  document.getElementById('pwForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await API.put('/auth/password', {
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: document.getElementById('newPassword').value
      });
      toast('Password updated');
      document.getElementById('pwForm').reset();
    } catch (err) { toast(err.message, 'error'); }
  };
}
</script>
</body></html>
